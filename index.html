<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送给Jing的专属爱心</title>
    <style>
        html, body {
            height: 100%;
            padding: 0;
            margin: 0;
            background: radial-gradient(circle, #200122, #000000);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .text-box {
            position: absolute;
            z-index: 2;
            text-align: center;
            color: #ff4d6d;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.5), 0 0 20px rgba(255, 77, 109, 0.3);
            animation: pulse 1.2s infinite ease-in-out;
            pointer-events: none;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            30% { transform: scale(1.1); }
            60% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="text-box">❤️ From Allen</div>

    <canvas id="pinkboard"></canvas>

    <script>
        var settings = {
            particles: {
                length:   600,
                duration:  2,   
                velocity: 100, 
                effect: -0.75, 
                size:      30,  
            },
        };

        (function(){var b=0;var c=["ms","moz","webkit","o"];for(var a=0;a<c.length&&!window.requestAnimationFrame;++a){window.requestAnimationFrame=window[c[a]+"RequestAnimationFrame"];window.cancelAnimationFrame=window[c[a]+"CancelAnimationFrame"]||window[c[a]+"CancelRequestAnimationFrame"]}if(!window.requestAnimationFrame){window.requestAnimationFrame=function(h,e){var d=new Date().getTime();var f=Math.max(0,16-(d-b));var g=window.setTimeout(function(){h(d+f)},f);b=d+f;return g}}if(!window.cancelAnimationFrame){window.cancelAnimationFrame=function(a){clearTimeout(a)}}})();

        var Point = (function() {
            function Point(x, y) {
                this.x = (typeof x !== 'undefined') ? x : 0;
                this.y = (typeof y !== 'undefined') ? y : 0;
            }
            Point.prototype.clone = function() { return new Point(this.x, this.y); };
            Point.prototype.length = function(length) {
                if (typeof length == 'undefined') return Math.sqrt(this.x * this.x + this.y * this.y);
                this.normalize(); this.x *= length; this.y *= length; return this;
            };
            Point.prototype.normalize = function() {
                var length = this.length(); if (length !== 0) { this.x /= length; this.y /= length; } return this;
            };
            return Point;
        })();

        var Particle = (function() {
            function Particle() {
                this.position = new Point();
                this.velocity = new Point();
                this.acceleration = new Point();
                this.age = 0;
            }
            Particle.prototype.initialize = function(x, y, dx, dy) {
                this.position.x = x; this.position.y = y;
                this.velocity.x = dx; this.velocity.y = dy;
                this.acceleration.x = dx * settings.particles.effect;
                this.acceleration.y = dy * settings.particles.effect;
                this.age = 0;
            };
            Particle.prototype.update = function(deltaTime) {
                this.position.x += this.velocity.x * deltaTime;
                this.position.y += this.velocity.y * deltaTime;
                this.velocity.x += this.acceleration.x * deltaTime;
                this.velocity.y += this.acceleration.y * deltaTime;
                this.age += deltaTime;
            };
            Particle.prototype.draw = function(context, image) {
                function ease(t) { return (--t) * t * t + 1; }
                var size = image.width * ease(this.age / settings.particles.duration);
                context.globalAlpha = 1 - this.age / settings.particles.duration;
                context.drawImage(image, this.position.x - size / 2, this.position.y - size / 2, size, size);
            };
            return Particle;
        })();

        var ParticlePool = (function() {
            var particles, firstActive = 0, firstFree = 0, duration = settings.particles.duration;
            function ParticlePool(length) {
                particles = new Array(length); for (var i = 0; i < particles.length; i++) particles[i] = new Particle();
            }
            ParticlePool.prototype.add = function(x, y, dx, dy) {
                particles[firstFree].initialize(x, y, dx, dy);
                firstFree++; if (firstFree == particles.length) firstFree = 0;
                if (firstActive == firstFree) firstActive++;
                if (firstActive == particles.length) firstActive = 0;
            };
            ParticlePool.prototype.update = function(deltaTime) {
                var i;
                if (firstActive < firstFree) {
                    for (i = firstActive; i < firstFree; i++) particles[i].update(deltaTime);
                }
                if (firstFree < firstActive) {
                    for (i = firstActive; i < particles.length; i++) particles[i].update(deltaTime);
                    for (i = 0; i < firstFree; i++) particles[i].update(deltaTime);
                }
                while (particles[firstActive].age >= duration && firstActive != firstFree) {
                    firstActive++; if (firstActive == particles.length) firstActive = 0;
                }
            };
            ParticlePool.prototype.draw = function(context, image) {
                var i;
                if (firstActive < firstFree) {
                    for (i = firstActive; i < firstFree; i++) particles[i].draw(context, image);
                }
                if (firstFree < firstActive) {
                    for (i = firstActive; i < particles.length; i++) particles[i].draw(context, image);
                    for (i = 0; i < firstFree; i++) particles[i].draw(context, image);
                }
            };
            return ParticlePool;
        })();

        (function(canvas) {
            var context = canvas.getContext('2d'),
                particles = new ParticlePool(settings.particles.length),
                particleRate = settings.particles.length / settings.particles.duration,
                time;
            function pointOnHeart(t) {
                var scale = 13; 
                var x = 16 * Math.pow(Math.sin(t), 3) * scale;
                var y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;
                
                return new Point(x, y * 1.15);
            }

            var image = (function() {
                var canvas = document.createElement('canvas'), context = canvas.getContext('2d');
                canvas.width = settings.particles.size; canvas.height = settings.particles.size;
                function to(t) {
                    var point = new Point(
                        16 * Math.pow(Math.sin(t), 3),
                        (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 1.15 
                    );
                    point.x = settings.particles.size / 2 + point.x * settings.particles.size / 40;
                    point.y = settings.particles.size / 2 - point.y * settings.particles.size / 40;
                    return point;
                }
                context.beginPath(); var t = -Math.PI; var point = to(t); context.moveTo(point.x, point.y);
                while (t < Math.PI) { t += 0.01; point = to(t); context.lineTo(point.x, point.y); }
                context.closePath(); context.fillStyle = '#ff4d6d'; context.fill();
                var image = new Image(); image.src = canvas.toDataURL(); return image;
            })();

            function onResize() {
                var dpr = window.devicePixelRatio || 1;
                canvas.width = canvas.clientWidth * dpr;
                canvas.height = canvas.clientHeight * dpr;
                context.scale(dpr, dpr);
            }
            window.onresize = onResize;

            function render() {
                requestAnimationFrame(render);
                var newTime = new Date().getTime() / 1000, deltaTime = newTime - (time || newTime); time = newTime;
                context.clearRect(0, 0, canvas.width, canvas.height);

                var amount = particleRate * deltaTime;
                for (var i = 0; i < amount; i++) {
                    var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());
                    var dir = pos.clone().normalize();
                    var g = 20 + Math.random() * 40; 
                    particles.add(canvas.clientWidth / 2 + pos.x, canvas.clientHeight / 2 - pos.y, dir.x * g, dir.y * g);
                }
                particles.update(deltaTime);
                particles.draw(context, image);
            }

            setTimeout(function() { onResize(); render(); }, 10);
        })(document.getElementById('pinkboard'));
    </script>
</body>
