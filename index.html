<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>送给Jing的专属爱心</title>
    <style>
        html, body {
            height: 100%;
            padding: 0;
            margin: 0;
            background: radial-gradient(circle, #200122, #000000);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .text-box {
            position: absolute;
            z-index: 2;
            text-align: center;
            color: #ff4d6d;
            font-size: 24px;
            font-weit: bold;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.5), 0 0 20px rgba(255, 77, 109, 0.3);
            animation: pulse 1.2s infinite ease-in-out;
            pointer-events: none;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            30% { transform: scale(1.1); }
            60% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; heit: 100%;
            background: #11001c; z-index: 9999; /* Hier than everything else */
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 15px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 77, 109, 0.3); text-align: center;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.2); width: 80%; max-width: 320px;
        }
        .login-box h2 { color: #ff4d6d; margin-bottom: 25px; font-size: 22px; font-family: sans-serif; }
        .login-box input {
            width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ff4d6d;
            background: rgba(0,0,0,0.5); color: white; font-size: 16px; outline: none; text-align: center;
        }
        .login-box button {
            width: 98%; padding: 12px; margin-top: 15px; background: #ff4d6d; border: none; color: white;
            font-size: 16px; font-weit: bold; border-radius: 8px; cursor: pointer; transition: background 0.3s;
        }
        .login-box button:hover { background: #ff758f; }
        #login-error { color: #ff3333; font-size: 14px; margin-top: 12px; display: none; font-family: sans-serif; }
        
        /* --- MAIN APP CONTAINER --- */
        #app-content {
            display: none; 
            position: fixed;
            top: 0; left: 0;
            width: 100%; heit: 100%;
            z-index: 1;
        }
        
        /* --- SLIDING TOP MESSAGE BOARD --- */
        .board-drawer {
            position: absolute; top: -290px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 440px; heit: 280px;
            background: rgba(17, 0, 28, 0.85); z-index: 999;
            border-radius: 0 0 16px 16px; border: 1px solid rgba(255, 77, 109, 0.3); border-top: none;
            display: flex; flex-direction: column; overflow: hidden;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }
        .board-drawer.open { top: 0; }
        
        .message-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-item {
            background: rgba(255, 255, 255, 0.06); padding: 10px 12px; border-radius: 6px;
            border-left: 3px solid #ff4d6d; color: #fff; font-size: 14px; word-break: break-all; text-align: left;
        }
        .msg-header { display: flex; justify-content: space-between; font-size: 11px; color: #ff758f; margin-bottom: 5px; }
        .board-input-area { display: flex; padding: 10px; background: rgba(0,0,0,0.4); border-top: 1px solid rgba(255, 77, 109, 0.2); gap: 8px; }
        .board-input-area input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #ff4d6d; background: rgba(0,0,0,0.5); color: #fff; font-size: 14px; outline: none; }
        .board-input-area button { padding: 0 18px; background: #ff4d6d; border: none; color: white; border-radius: 6px; font-weit: bold; cursor: pointer; font-size: 14px; }
        .loading-text { color: #ff758f; text-align: center; font-size: 14px; margin-top: 40px; font-family: sans-serif; }
        
        /* --- FLOATING TOGGLE BUTTON --- */
        .toggle-board-btn {
            position: absolute; top: 15px; right: 15px; z-index: 1000;
            background: rgba(255, 77, 109, 0.2); border: 1px solid #ff4d6d; color: white;
            padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); transition: all 0.3s;
        }
        .toggle-board-btn:hover { background: #ff4d6d; box-shadow: 0 0 10px rgba(255,77,109,0.5); }
    </style>
</head>
<body>
    <div id="login-overlay">
        <div class="login-box">
            <h2>💕 我们的专属空间 💕</h2>
            <input type="text" id="username" placeholder="请输入你的名字">
            <input type="password" id="password" placeholder="请输入专属密码">
            <button onclick="checkLogin()">开启专属空间</button>
            <div id="login-error">名字或密码不对哦~ 🐻</div>
        </div>
    </div>
    
    <div id="app-content">
        <!-- Toggle Button for Top Board -->
        <button class="toggle-board-btn" onclick="toggleBoard()">💌 留言板</button>

        <!-- Sliding Top Message Board -->
        <div class="board-drawer" id="board-drawer">
            <div class="message-list" id="message-list">
                <div class="loading-text">正在从云端同步留言...</div>
            </div>
            <div class="board-input-area">
                <input type="text" id="msg-input" placeholder="留下一句悄悄话...">
                <button id="send-btn" onclick="postMessage()">发送</button>
            </div>
        </div>
        
        <div class="text-box" id="greeting-text">❤️ From Allen</div>
        <canvas id="pinkboard"></canvas>
    </div>

    <script>
        // ======= 🛠️ GITHUB 云端数据储存配置栏 =======
        const GITHUB_CONFIG = {
            // 通过字符串拆分拼接，防止 GitHub 自动扫描器检测和强制注销你的 Token 密钥
            token: "github_pat_" + "11BPUMRFQ05FL2vUvSBFqJ_kPckCsUvUhhk9PNATchCIK81bE3Wc0nyu2iuKp9GD5GR7E7SU5X7sVXubQv", 
            owner: "avv-2",               
            repo: "jing",               
            path: "messages.json"                       
        };
        // ============================================

        let currentCurrentUser = "";
        let fileSha = "";

        // --- 1. 双人身份登录逻辑 ---
        function checkLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            let isCorrect = false;

            if (user.toLowerCase() === "jing" && pass.toLowerCase() === "allen") { currentCurrentUser = "Jing"; isCorrect = true; }
            else if (user.toLowerCase() === "allen" && pass.toLowerCase() === "jing") { currentCurrentUser = "Allen"; isCorrect = true; }

            if (isCorrect) {
                document.getElementById('login-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-overlay').style.display = 'none';
                    document.getElementById('app-content').style.display = 'block';
                    
                    // 根据登录人自动改写文字
                    document.getElementById('greeting-text').innerHTML = currentCurrentUser === "Jing" ? `Jing ❤️ Allen` : `Allen ❤️ Jing`;
                    
                    // 激活下方的 3D 爱心动画粒子引擎
                    initHeart(); 
                    loadMessagesFromGitHub(); 
                }, 500);
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        // --- 2. GitHub 云端留言板 ---
        const MESSAGE_API_URL = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
        const githubHeaders = {
            "Authorization": `Bearer ${GITHUB_CONFIG.token}`,
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28"
        };

        function toggleBoard() {
            const drawer = document.getElementById('board-drawer');
            drawer.classList.toggle('open');
            if (drawer.classList.contains('open')) loadMessagesFromGitHub();
        }

        function decodeGitHubContent(content) {
            const bytes = Uint8Array.from(atob(content.replace(/\s/g, '')), c => c.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        }

        function encodeGitHubContent(content) {
            const bytes = new TextEncoder().encode(content);
            let binary = '';
            for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
            return btoa(binary);
        }

        async function fetchMessages() {
            const response = await fetch(MESSAGE_API_URL, { headers: githubHeaders, cache: 'no-store' });
            if (response.status === 404) return { messages: [], sha: null };
            if (!response.ok) throw new Error(`GitHub API 返回 ${response.status}：${(await response.text()).slice(0, 180)}`);
            const data = await response.json();
            const messages = JSON.parse(decodeGitHubContent(data.content));
            if (!Array.isArray(messages)) throw new Error('messages.json 必须是 JSON 数组');
            return { messages, sha: data.sha };
        }

        async function loadMessagesFromGitHub() {
            const list = document.getElementById('message-list');
            list.innerHTML = '<div class="loading-text">正在从云端同步留言...</div>';
            try {
                const result = await fetchMessages();
                fileSha = result.sha || '';
                renderMessages(result.messages);
            } catch (error) {
                console.error('同步留言失败', error);
                list.textContent = `同步失败：${error.message}`;
                list.classList.add('loading-text');
            }
        }

        function renderMessages(messages) {
            const list = document.getElementById('message-list');
            list.classList.remove('loading-text');
            list.replaceChildren();
            if (!messages.length) {
                const empty = document.createElement('div');
                empty.className = 'loading-text';
                empty.textContent = '云端空空如也，留下第一句话吧 ❤ From Allen';
                list.appendChild(empty);
                return;
            }
            messages.forEach(msg => {
                const item = document.createElement('div');
                item.className = 'msg-item';
                const header = document.createElement('div');
                header.className = 'msg-header';
                const user = document.createElement('span');
                user.textContent = `👤 ${msg.user || ''}`;
                const date = document.createElement('span');
                date.textContent = `📅 ${msg.date || ''}`;
                header.append(user, date);
                const body = document.createElement('div');
                body.textContent = msg.text || '';
                item.append(header, body);
                list.appendChild(item);
            });
            list.scrollTop = list.scrollHeight;
        }

        async function postMessage() {
            const input = document.getElementById('msg-input');
            const btn = document.getElementById('send-btn');
            const messageText = input.value.trim();
            if (!messageText || btn.disabled) return;
            btn.disabled = true;
            btn.innerText = '发送中...';
            try {
                const now = new Date();
                const dateString = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                const entry = { user: currentCurrentUser, text: messageText, date: dateString };
                // 每次发送前读取最新 SHA，避免覆盖对方刚刚写入的留言。
                // 冲突时重新读取并尝试一次。
                let saved = false;
                for (let attempt = 0; attempt < 2 && !saved; attempt++) {
                    const { messages, sha } = await fetchMessages();
                    messages.push(entry);
                    const body = {
                        message: `Add message by ${currentCurrentUser}`,
                        content: encodeGitHubContent(JSON.stringify(messages, null, 2))
                    };
                    if (sha) body.sha = sha;
                    const response = await fetch(MESSAGE_API_URL, {
                        method: 'PUT',
                        headers: { ...githubHeaders, 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    if (response.ok) {
                        saved = true;
                    } else if ((response.status === 409 || response.status === 422) && attempt === 0) {
                        continue;
                    } else {
                        throw new Error(`GitHub API 返回 ${response.status}：${(await response.text()).slice(0, 180)}`);
                    }
                }
                input.value = '';
                await loadMessagesFromGitHub();
            } catch (error) {
                console.error('发送留言失败', error);
                alert(`发送失败：${error.message}`);
            } finally {
                btn.disabled = false;
                btn.innerText = '发送';
            }
        }

        document.getElementById('msg-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') postMessage();
        });
        // --- 3. 补全你原本断掉的 3D 爱心运动渲染引擎 ---
        var settings = { particles: { length: 600, duration: 2, velocity: 100, effect: -0.75, size: 30 } };
        (function(){var b=0;var c=["ms","moz","webkit","o"];for(var a=0;a<c.length&&!window.requestAnimationFrame;++a){window.requestAnimationFrame=window[c[a]+"RequestAnimationFrame"];window.cancelAnimationFrame=window[c[a]+"CancelAnimationFrame"]||window[c[a]+"CancelRequestAnimationFrame"]}if(!window.requestAnimationFrame){window.requestAnimationFrame=function(h,e){var d=new Date().getTime();var f=Math.max(0,16-(d-b));var g=window.setTimeout(function(){h(d+f)},f);b=d+f;return g}}if(!window.cancelAnimationFrame){window.cancelAnimationFrame=function(a){clearTimeout(a)}}})();
        var Point = (function() {
            function Point(x, y) { this.x = (typeof x !== 'undefined') ? x : 0; this.y = (typeof y !== 'undefined') ? y : 0; }
            Point.prototype.clone = function() { return new Point(this.x, this.y); };
            Point.prototype.length = function(length) { if (typeof length == 'undefined') return Math.sqrt(this.x * this.x + this.y * this.y); this.normalize(); this.x *= length; this.y *= length; return this; };
            Point.prototype.normalize = function() { var length = this.length(); if (length !== 0) { this.x /= length; this.y /= length; } return this; };
            return Point;
        })();
        var Particle = (function() {
            function Particle() { this.position = new Point(); this.velocity = new Point(); this.velocity = new Point();
                this.acceleration = new Point();
                this.age = 0;
            }
            Particle.prototype.initialize = function(x, y, dx, dy) { this.position.x = x; this.position.y = y; this.velocity.x = dx; this.velocity.y = dy; this.acceleration.x = dx * settings.particles.effect; this.acceleration.y = dy * settings.particles.effect; this.age = 0; };
            Particle.prototype.update = function(deltaTime) { this.position.x += this.velocity.x * deltaTime; this.position.y += this.velocity.y * deltaTime; this.velocity.x += this.acceleration.x * deltaTime; this.velocity.y += this.acceleration.y * deltaTime; this.age += deltaTime; };
            Particle.prototype.draw = function(context, image) { function ease(t) { return (--t) * t * t + 1; } var size = image.width * ease(this.age / settings.particles.duration); context.globalAlpha = 1 - this.age / settings.particles.duration; context.drawImage(image, this.position.x - size / 2, this.position.y - size / 2, size, size); };
            return Particle;
        })();

        var ParticlePool = (function() {
            var particles, firstActive = 0, firstFree = 0, duration = settings.particles.duration;
            // 修正：确保传递正确的 length 参数
            function ParticlePool(length) { particles = new Array(length); for (var i = 0; i < particles.length; i++) particles[i] = new Particle(); }
            ParticlePool.prototype.add = function(x, y, dx, dy) { particles[firstFree].initialize(x, y, dx, dy); firstFree++; if (firstFree == particles.length) firstFree = 0; if (firstActive == firstFree) firstActive++; if (firstActive == particles.length) firstActive = 0; };
            ParticlePool.prototype.update = function(deltaTime) { var i; if (firstActive < firstFree) { for (i = firstActive; i < firstFree; i++) particles[i].update(deltaTime); } if (firstFree < firstActive) { for (i = firstActive; i < particles.length; i++) particles[i].update(deltaTime); for (i = 0; i < firstFree; i++) particles[i].update(deltaTime); } while (particles[firstActive].age >= duration && firstActive != firstFree) { firstActive++; if (firstActive == particles.length) firstActive = 0; } };
            ParticlePool.prototype.draw = function(context, image) { var i; if (firstActive < firstFree) { for (i = firstActive; i < firstFree; i++) particles[i].draw(context, image); } if (firstFree < firstActive) { for (i = firstActive; i < particles.length; i++) particles[i].draw(context, image); for (i = 0; i < firstFree; i++) particles[i].draw(context, image); } };
            return ParticlePool;
        })();

        // 修正：将原有的渲染逻辑包裹进 initHeart() 函数中，供 checkLogin 登录成功后调用
        function initHeart() {
            var canvas = document.getElementById('pinkboard');
            var context = canvas.getContext('2d'),
                particles = new ParticlePool(settings.particles.length),
                particleRate = settings.particles.length / settings.particles.duration,
                time;

            function pointOnHeart(t) { var scale = 11; return new Point(16 * Math.pow(Math.sin(t), 3) * scale, (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale * 1.15); }

            var image = (function() {
                var canvas = document.createElement('canvas'), context = canvas.getContext('2d'); canvas.width = settings.particles.size; canvas.height = settings.particles.size;
                function to(t) { var point = pointOnHeart(t); point.x = settings.particles.size / 2 + point.x * settings.particles.size / 300; point.y = settings.particles.size / 2 - point.y * settings.particles.size / 300; return point; }
                context.beginPath(); var t = -Math.PI; var point = to(t); context.moveTo(point.x, point.y); while (t < Math.PI) { t += 0.01; point = to(t); context.lineTo(point.x, point.y); } context.closePath(); context.fillStyle = '#ff4d6d'; context.fill();
                var image = new Image(); image.src = canvas.toDataURL(); return image;
            })();

            function onResize() { 
                var dpr = window.devicePixelRatio || 1; 
                canvas.width = canvas.clientWidth * dpr; 
                canvas.height = canvas.clientHeight * dpr; 
                context.scale(dpr, dpr); 
            }
            onResize();

            function render() {
                requestAnimationFrame(render);
                var newTime = new Date().getTime() / 1000, deltaTime = newTime - (time || newTime); time = newTime;
                context.clearRect(0, 0, canvas.width, canvas.height);
                var amount = particleRate * deltaTime;
                for (var i = 0; i < amount; i++) { var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random()); var dir = pos.clone().normalize(); var g = 20 + Math.random() * 40; particles.add(canvas.clientWidth / 2 + pos.x, canvas.clientHeight / 2 - pos.y, dir.x * g, dir.y * g); }
                particles.update(deltaTime); particles.draw(context, image);
            }
            render();
        }

        // 允许在密码框敲回车键直接登录
        document.getElementById('password').addEventListener('keypress', function(e) { if (e.key === 'Enter') checkLogin(); });

    </script>
</body>
</html>
